<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="theme-toggle">
      <label class="switch">
        <input type="checkbox" id="theme-switch" aria-label="Cambiar a modo claro" />
        <span class="slider"></span>
      </label>
      <span class="label" id="theme-label">DARK</span>
    </div>
    <h1 class="game-title">TETRIS</h1>

    <div id="start-screen">
      <div class="start-stats">
        <div class="start-stat">
          <span class="label">MEJOR COMBO</span>
          <span class="value" id="global-best-combo">0</span>
        </div>
        <div class="start-stat">
          <span class="label">LÍNEAS MÁXIMAS</span>
          <span class="value" id="global-max-lines">0</span>
        </div>
      </div>

      <table class="records-table" id="start-records-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Puntuación</th>
            <th>Líneas</th>
            <th>Combo</th>
          </tr>
        </thead>
        <tbody id="start-records-body"></tbody>
      </table>

      <div class="start-actions">
        <button id="play-btn">JUGAR</button>
        <button id="reset-records-btn">Resetear records</button>
      </div>
    </div>

    <div class="game-container hidden">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="new-record-form" class="hidden">
          <p class="new-record-msg">¡Nuevo record! Escribe tu nombre:</p>
          <input id="player-name" type="text" maxlength="12" placeholder="Nombre" />
          <button id="save-record-btn">Guardar</button>
        </div>
        <table class="records-table hidden" id="overlay-records-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Nombre</th>
              <th>Puntuación</th>
              <th>Líneas</th>
              <th>Combo</th>
            </tr>
          </thead>
          <tbody id="overlay-records-body"></tbody>
        </table>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
